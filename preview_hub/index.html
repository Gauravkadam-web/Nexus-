    <!-- Viewport Container -->
    <div id="viewport-wrapper" class="device-frame bg-[#161B22] border-4 border-[#30363D] rounded-[36px] p-3 shadow-2xl overflow-hidden flex flex-col items-center w-[390px] h-[844px]">
      <!-- Mobile Notch Bar -->
      <div id="notch" class="w-36 h-4 bg-[#30363D] rounded-full mb-2 shrink-0"></div>
      
      <!-- Live Iframe -->
      <iframe id="preview-frame" src="/docs/stitch_screen_ui_generator_mob/scr_11_team_lead_command_workload_monitor_mobile/code.html" class="w-full h-full rounded-[24px] bg-white border-0"></iframe>
    </div>

  <script>
    let currentMobileUrl = '/docs/stitch_screen_ui_generator_mob/scr_11_team_lead_command_workload_monitor_mobile/code.html';
    let currentDesktopUrl = '/docs/stitch_screen_ui_generator_web/scr_11_team_lead_command_workload_monitor/code.html';
    let currentMode = 'mobile';

    function loadScreen(mobUrl, webUrl, title, element) {
      currentMobileUrl = mobUrl;
      currentDesktopUrl = webUrl;
      document.getElementById('active-title').innerText = title;
      
      // Update buttons style
      const buttons = document.querySelectorAll('.screen-btn');
      buttons.forEach(btn => {
        btn.classList.remove('bg-[#6366F1]', 'text-white');
        btn.classList.add('glass-card', 'text-[#F0F6FC]');
      });
      if (element) {
        element.classList.remove('glass-card', 'text-[#F0F6FC]');
        element.classList.add('bg-[#6366F1]', 'text-white');
      }

      updateIframe();
    }

    function setDevice(mode) {
      currentMode = mode;
      const wrapper = document.getElementById('viewport-wrapper');
      const notch = document.getElementById('notch');
      const btnMobile = document.getElementById('btn-mobile');
      const btnDesktop = document.getElementById('btn-desktop');

      if (mode === 'mobile') {
        wrapper.className = "device-frame bg-[#161B22] border-4 border-[#30363D] rounded-[36px] p-2 overflow-hidden flex flex-col items-center w-[390px] h-[780px]";
        notch.style.display = 'block';
        btnMobile.className = "px-3 py-1.5 rounded-lg bg-[#6366F1] text-white text-xs font-semibold flex items-center gap-1.5 transition-all";
        btnDesktop.className = "px-3 py-1.5 rounded-lg text-[#8B949E] hover:text-white text-xs font-medium flex items-center gap-1.5 transition-all";
      } else {
        wrapper.className = "device-frame bg-[#161B22] border-4 border-[#30363D] rounded-2xl p-1 overflow-hidden flex flex-col items-center w-full h-[820px] max-w-6xl";
        notch.style.display = 'none';
        btnDesktop.className = "px-3 py-1.5 rounded-lg bg-[#6366F1] text-white text-xs font-semibold flex items-center gap-1.5 transition-all";
        btnMobile.className = "px-3 py-1.5 rounded-lg text-[#8B949E] hover:text-white text-xs font-medium flex items-center gap-1.5 transition-all";
      }

      updateIframe();
    }

    function updateIframe() {
      const frame = document.getElementById('preview-frame');
      const directLink = document.getElementById('direct-link');
      const targetUrl = (currentMode === 'mobile') ? currentMobileUrl : currentDesktopUrl;
      frame.src = targetUrl;
      directLink.href = targetUrl;
    }
  </script>
